        <rect x="45" y="35" width="210" height="38" rx="19" fill="#C84B15" fill-opacity="0.12" />
        <text x="150" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="700" fill="#C84B15">TV 5 • POSITION 5</text>

        <text x="45" y="125" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="46" font-weight="800" fill="#1C1C1E" letter-spacing="-0.5">Grill & Prime Cuts</text>
        <text x="45" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="500" fill="#8E8E93">Lava-Grill Spezialitäten & Zarte Steaks</text>

