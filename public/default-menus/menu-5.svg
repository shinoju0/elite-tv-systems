        <text x="1600" y="20" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="500" fill="#AEAEB2">Alle Preise inkl. MwSt. • Frisch zubereitet</text>
